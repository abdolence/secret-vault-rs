[package]
name = "secret-vault"
version = "3.0.2"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
license = "Apache-2.0"
description = "Library provides a secure vault to store securely application secrets in memory from Google, AWS, Azure Key Vault, HashiCorp Vault, K8S and environment variables"
homepage = "https://github.com/abdolence/secret-vault-rs"
repository = "https://github.com/abdolence/secret-vault-rs"
documentation = "https://docs.rs/secret-vault"
categories = ["cryptography","api-bindings"]
keywords = ["secret", "google", "aws", "azure", "hashicorp-vault"]
readme = "../README.md"
include = ["Cargo.toml", "src/**/*.rs", "../README.md", "../LICENSE", "../SECURITY.md"]

[badges]
maintenance = { status = "actively-developed" }

[lib]
name = "secret_vault"
path = "src/lib.rs"
bench = false

[dependencies]
tracing = "0.1"
secret-vault-value = { version = "1.0", features= ["hex"] }
tokio = { version = "1", features = ["sync", "tracing","time", "rt", "macros"], default-features = false }
rvstruct = "0.3"
rsb_derive = "0.5"
async-trait = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "serde"] }
zeroize = { version = "1.8", features = ["std", "derive"] }
hex = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
gcloud-sdk = { version = "0.33", default-features = false, optional = true }
aws-config = { version = "1", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
kms-aead = { git = "https://github.com/abdolence/kms-aead-rs", rev = "d4278436fd14c774673565d4a95810b3c0b50ca1", optional = true }
ahash = { version = "0.8", optional = true }
azure_core = { version = "1.1", optional = true, default-features = false, features = ["reqwest", "tokio"] }
azure_security_keyvault_secrets = { version = "1.0.1", optional = true, default-features = false }
# Selects the TLS features of the reqwest client azure_core builds, so it must stay on the reqwest
# version azure_core depends on.
reqwest = { version = "0.13.2", optional = true, default-features = false }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }


[dev-dependencies]
proptest = "1.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.10"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
criterion = { version = "0.8", features = ["async", "async_futures", "cargo_bench_support", "html_reports","async_tokio"] }
cargo-husky = { version = "1.5", default-features = false, features = ["run-for-all", "prepush-hook", "run-cargo-fmt"] }
azure_identity = { version = "1.0", default-features = false }
azure_security_keyvault_keys = { version = "1.0.1", default-features = false }


[features]
default = []
serde = ["dep:serde", "secret-vault-value/serde"]
# AEAD backends of the encryption of stored values, any number of them in one build. Each KMS
# encryption feature needs one too.
ring = ["dep:kms-aead", "kms-aead/ring"]
aws-lc = ["dep:kms-aead", "kms-aead/aws-lc"]
aws-lc-fips = ["dep:kms-aead", "kms-aead/aws-lc-fips"]
rustcrypto = ["dep:kms-aead", "kms-aead/rustcrypto"]
gcp-base = ["gcloud-sdk"]
# TLS variants - user can choose one
gcp-tls-roots = ["gcp-base", "gcloud-sdk/tls-roots"]
gcp-tls-webpki = ["gcp-base", "gcloud-sdk/tls-webpki-roots"]
# The Secret Manager source without a rustls crypto provider, for applications that install their own
gcp-secretmanager-base = ["gcp-base", "gcloud-sdk/google-cloud-secretmanager-v1"]
gcp-secretmanager = ["gcp-secretmanager-base", "gcloud-sdk/auth-default-crypto"]

# The KMS envelope encryption without a rustls crypto provider, for applications that install their own
gcp-kms-base = ["gcp-base", "kms-aead/gcp-kms-encryption-base"]
gcp-kms = ["gcp-kms-base", "gcloud-sdk/auth-default-crypto"]

gcp = ["gcp-tls-roots"]  # Default to tls-roots for backward compatibility
aws = ["dep:aws-config"]

aws-secretmanager = ["aws", "dep:aws-sdk-secretsmanager"]
aws-kms-encryption = ["aws", "dep:aws-sdk-kms", "kms-aead/aws-kms-encryption"]

azure-keyvault-base = [
    "dep:azure_core",
    "dep:azure_security_keyvault_secrets",
    "dep:reqwest",
    "dep:serde_json",
]
# TLS variants - user can choose one
azure-keyvault-tls-aws-lc-rs = ["azure-keyvault-base", "azure_core/reqwest_rustls"]
azure-keyvault-tls-no-provider = ["azure-keyvault-base", "reqwest/rustls-no-provider"]
azure-keyvault-native-tls = ["azure-keyvault-base", "reqwest/native-tls"]
azure-keyvault = ["azure-keyvault-tls-aws-lc-rs"]

azure-kms-base = ["dep:azure_core", "kms-aead/azure-kms-encryption-base"]
# TLS variants - user can choose one, the same one as for azure-keyvault
azure-kms-tls-aws-lc-rs = ["azure-kms-base", "kms-aead/azure-kms-encryption-tls-aws-lc-rs"]
azure-kms-tls-no-provider = ["azure-kms-base", "kms-aead/azure-kms-encryption-tls-no-provider"]
azure-kms-native-tls = ["azure-kms-base", "kms-aead/azure-kms-encryption-native-tls"]
azure-kms = ["azure-kms-tls-aws-lc-rs"]

hashicorp-vault-base = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:http-body-util",
    "dep:rustls",
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_json",
]
# TLS root store variants - user can choose one
hashicorp-vault-tls-roots = ["hashicorp-vault-base", "dep:rustls-native-certs"]
hashicorp-vault-tls-webpki = ["hashicorp-vault-base", "dep:webpki-roots"]
# TLS crypto provider variants - user can choose one
hashicorp-vault-tls-aws-lc-rs = ["hashicorp-vault-base", "rustls/aws_lc_rs"]
hashicorp-vault-tls-ring = ["hashicorp-vault-base", "rustls/ring"]
hashicorp-vault = ["hashicorp-vault-tls-roots", "hashicorp-vault-tls-aws-lc-rs"]

hashicorp-vault-transit-base = ["kms-aead/hashicorp-vault-transit-kms-encryption-base"]
# TLS root store variants - user can choose one
hashicorp-vault-transit-tls-roots = ["hashicorp-vault-transit-base", "kms-aead/hashicorp-vault-transit-kms-encryption-tls-roots"]
hashicorp-vault-transit-tls-webpki = ["hashicorp-vault-transit-base", "kms-aead/hashicorp-vault-transit-kms-encryption-tls-webpki"]
# TLS crypto provider variants - user can choose one
hashicorp-vault-transit-tls-aws-lc-rs = ["hashicorp-vault-transit-base", "kms-aead/hashicorp-vault-transit-kms-encryption-tls-aws-lc-rs"]
hashicorp-vault-transit-tls-ring = ["hashicorp-vault-transit-base", "kms-aead/hashicorp-vault-transit-kms-encryption-tls-ring"]
hashicorp-vault-transit = ["hashicorp-vault-transit-tls-roots", "hashicorp-vault-transit-tls-aws-lc-rs"]

ahash = ["dep:ahash"]

[package.metadata.release]
tag-prefix=""

[package.metadata.docs.rs]
all-features = false
features = [
    "serde",
    "ring",
    "aws-lc",
    "rustcrypto",
    "gcp-tls-roots",
    "gcp-secretmanager",
    "gcp-kms",
    "aws",
    "aws-secretmanager",
    "aws-kms-encryption",
    "azure-keyvault",
    "azure-kms",
    "hashicorp-vault",
    "hashicorp-vault-transit",
    "ahash"
]

[[example]]
name = "gcp_secret_manager_vault"
path = "examples/gcp_secret_manager_vault.rs"
required-features = ["gcp-secretmanager", "aws-lc"]

[[example]]
name = "aws_secret_manager_vault"
path = "examples/aws_secret_manager_vault.rs"
required-features = ["aws-secretmanager", "aws-lc"]

[[example]]
name = "hashicorp_vault"
path = "examples/hashicorp_vault.rs"
required-features = ["hashicorp-vault-base", "aws-lc"]

[[example]]
name = "kms_gcp_secret_manager_vault"
path = "examples/kms_gcp_secret_manager_vault.rs"
required-features = ["gcp-secretmanager", "gcp-kms", "aws-lc"]

[[example]]
name = "kms_aws_secret_manager_vault"
path = "examples/kms_aws_secret_manager_vault.rs"
required-features = ["aws-secretmanager", "aws-kms-encryption", "aws-lc"]

[[example]]
name = "kms_azure_key_vault"
path = "examples/kms_azure_key_vault.rs"
required-features = ["azure-keyvault-base", "azure-kms-base", "aws-lc"]

[[example]]
name = "kms_hashicorp_vault"
path = "examples/kms_hashicorp_vault.rs"
required-features = ["hashicorp-vault-base", "hashicorp-vault-transit-base", "aws-lc"]

[[example]]
name = "insecure_env_secret_vault"
path = "examples/insecure_env_secret_vault.rs"

[[example]]
name = "auto_refresh_secret_manager_vault"
path = "examples/auto_refresh_secret_manager_vault.rs"
required-features = ["aws-secretmanager"]

[[example]]
name = "azure_key_vault"
path = "examples/azure_key_vault.rs"
required-features = ["azure-keyvault-base", "aws-lc"]

[[test]]
name = "azure_key_vault_emulator"
path = "tests/azure_key_vault_emulator.rs"
required-features = ["azure-keyvault-base"]

[[test]]
name = "hashicorp_vault_transit"
path = "tests/hashicorp_vault_transit.rs"
required-features = ["hashicorp-vault-transit-base", "aws-lc"]

[[bench]]
name = "read_vault_bench"
path = "benches/read_vault_bench.rs"
required-features = ["aws-lc", "ahash"]
harness = false

[[example]]
name = "multiple_sources"
path = "examples/multiple_sources.rs"
required-features = ["aws-secretmanager"]

[[example]]
name = "files_source"
path = "examples/files_source.rs"

[[example]]
name = "hashmap_snapshot"
path = "examples/hashmap_snapshot.rs"
required-features = ["ahash"]

[[example]]
name = "secret_gen_source"
path = "examples/secret_gen_source.rs"
