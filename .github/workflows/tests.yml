name: tests & formatting
on:
  push:
  pull_request:
    types: [opened]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
      - name: Run checks
        run: |
          # Format check
          cargo fmt -- --check
          
          # Common features for both variants
          FEATURES="serde,ring-aead-encryption,kms,gcp-secretmanager,aws,aws-secretmanager,aws-kms-encryption,azure-keyvault,hashicorp-vault,ahash"
          
          # Run checks with gcp-tls-roots
          cargo clippy --features "$FEATURES,gcp-tls-roots,gcp-kms-tls-roots" -- -Dwarnings
          cargo test --features "$FEATURES,gcp-tls-roots,gcp-kms-tls-roots"
          
          # Run checks with gcp-tls-webpki
          cargo clippy --features "$FEATURES,gcp-tls-webpki,gcp-kms-webpki" -- -Dwarnings
          cargo test --features "$FEATURES,gcp-tls-webpki,gcp-kms-webpki"
  # TLS variants of the Azure and HashiCorp sources other than the defaults the build job checks
  tls-variants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tls:
          - azure-keyvault-rustls-no-provider
          - azure-keyvault-native-tls
          - hashicorp-vault-tls-webpki,hashicorp-vault-tls-aws-lc-rs
          - hashicorp-vault-tls-roots,hashicorp-vault-tls-ring
          - hashicorp-vault-tls-webpki,hashicorp-vault-tls-ring
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: clippy
      - name: Run checks
        run: |
          cargo clippy -p secret-vault --no-default-features --features "ring-aead-encryption,${{ matrix.tls }}" --all-targets -- -Dwarnings
          cargo test -p secret-vault --no-default-features --features "ring-aead-encryption,${{ matrix.tls }}"
