name: tests & formatting
on:
  push:
  pull_request:
    types: [opened]
jobs:
  # One job per TLS variant over the features of every source. AWS has no TLS features and
  # GCP KMS only supports aws-lc-rs, so the ring variants leave GCP KMS out. In the ring variants
  # GCP and Azure use the provider the application installs, which is how they run with ring.
  tls-variant:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: roots-aws-lc-rs
            tls: gcp-tls-roots,gcp-tls-aws-lc-rs,gcp-kms-tls-roots,azure-keyvault-tls-aws-lc-rs,hashicorp-vault-tls-roots,hashicorp-vault-tls-aws-lc-rs
          - variant: webpki-aws-lc-rs
            tls: gcp-tls-webpki,gcp-tls-aws-lc-rs,gcp-kms-tls-webpki,azure-keyvault-tls-aws-lc-rs,hashicorp-vault-tls-webpki,hashicorp-vault-tls-aws-lc-rs
          - variant: roots-ring
            tls: gcp-tls-roots,gcp-tls-no-provider,azure-keyvault-tls-no-provider,hashicorp-vault-tls-roots,hashicorp-vault-tls-ring
          - variant: webpki-ring
            tls: gcp-tls-webpki,gcp-tls-no-provider,azure-keyvault-tls-no-provider,hashicorp-vault-tls-webpki,hashicorp-vault-tls-ring
          - variant: native-tls
            tls: gcp-tls-roots,gcp-tls-aws-lc-rs,gcp-kms-tls-roots,azure-keyvault-native-tls,hashicorp-vault-tls-roots,hashicorp-vault-tls-aws-lc-rs
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
      - name: Run checks
        run: |
          cargo fmt -- --check

          FEATURES="serde,ring-aead-encryption,kms,gcp-secretmanager,aws,aws-secretmanager,aws-kms-encryption,ahash,${{ matrix.tls }}"
          cargo clippy --workspace --all-targets --features "$FEATURES" -- -Dwarnings
          cargo test --workspace --features "$FEATURES"
